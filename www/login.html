<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity Valley | Login</title>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 20% 20%, #1a2a6c, #111936 60%, #090d1a 100%), url('./static/images/loginpage.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .back-nav {
            width: 100%;
            max-width: 380px;
            margin-bottom: 14px;
            display: flex;
            justify-content: flex-start;
        }
        .btn-back-menu {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .btn-back-menu:hover {
            background: rgba(255, 255, 255, 0.28);
            transform: translateX(-3px);
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            padding: 36px 28px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.35);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border-top: 5px solid #3498db;
            animation: cardPop 0.35s ease-out;
        }
        @keyframes cardPop {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-card h2 {
            margin: 0 0 8px 0;
            color: #2c3e50;
            font-size: 1.8rem;
        }
        .login-card p {
            color: #7f8c8d;
            margin: 0 0 20px 0;
            font-size: 0.95rem;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            margin: 8px 0;
            border: 1.5px solid #dce4ec;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #3498db;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.15s, opacity 0.2s;
        }
        button:active { transform: scale(0.97); }
        .btn-login { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .btn-signup { background: linear-gradient(135deg, #3498db, #2980b9); }
        .error-text { color: #e74c3c; font-size: 0.9rem; margin-top: 12px; min-height: 20px; }
    </style>
</head>
<body>

    <div class="back-nav">
        <a href="/" class="btn-back-menu" onclick="if(window.location.protocol==='file:'){this.href='index.html';}">← Back to Main Menu</a>
    </div>

    <div class="login-card">
        <h2>⚡ Velocity Valley</h2>
        <p>Log in or create an account to save your simulation progress and streaks.</p>
        
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password" required>
        
        <div class="btn-row">
            <button class="btn-login" onclick="loginUser()">Log In</button>
            <button class="btn-signup" onclick="signUpUser()">Sign Up</button>
        </div>

        <p id="error-message" class="error-text"></p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA13Ven5xlpBW0ub_Wou92ZgQgiV2BzYzo",
            authDomain: "velocity-valley-edu.firebaseapp.com",
            projectId: "velocity-valley-edu",
            storageBucket: "velocity-valley-edu.firebasestorage.app",
            messagingSenderId: "340043533038",
            appId: "1:340043533038:web:0abf2444b8ac6da07f41ff"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.firestore();
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorText = document.getElementById('error-message');

        function goHome() {
            window.location.replace(window.location.protocol === 'file:' ? 'index.html' : '/');
        }

        function loginUser() {
            errorText.innerText = "";
            firebase.auth().signInWithEmailAndPassword(emailInput.value, passwordInput.value)
                .then((userCredential) => {
                    const user = userCredential.user;
                    db.collection("users").doc(user.uid).set({
                        email: user.email,
                        totalLogins: firebase.firestore.FieldValue.increment(1),
                        lastLogin: new Date().toLocaleString('en-GB')
                    }, { merge: true })
                    .then(() => { goHome(); })
                    .catch((dbError) => {
                        console.error("Ralat Buku Log: ", dbError);
                        goHome();
                    });
                })
                .catch((error) => {
                    errorText.innerText = error.message;
                });
        }

        function signUpUser() {
            errorText.innerText = "";
            firebase.auth().createUserWithEmailAndPassword(emailInput.value, passwordInput.value)
                .then((userCredential) => {
                    const user = userCredential.user;
                    db.collection("users").doc(user.uid).set({
                        email: user.email,
                        totalLogins: 1,
                        simsExplored: 0,
                        streakCount: 0,
                        recentActivities: [],
                        isPro: false,
                        lastLogin: new Date().toLocaleString('en-GB')
                    }, { merge: true }).then(() => {
                        goHome();
                    });
                })
                .catch((error) => { errorText.innerText = error.message; });
        }
    </script>
</body>
</html>
