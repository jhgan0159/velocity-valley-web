<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity Valley | Login</title>
    
    <!-- Firebase Libraries (Notice we removed the FirebaseUI library!) -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>

    <style>
        /* A simple, clean design for your login card */
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding-top: 100px; }
        .login-card { background: rgb(255, 251, 251); padding: 40px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 45%; padding: 10px; margin: 5px 2%; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; }
        .btn-login { background-color: #4CAF50; }
        .btn-signup { background-color: #008CBA; }
        .error-text { color: red; font-size: 14px; margin-top: 10px; }
        body {
            background-image: url('/static/images/loginpage.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* Keeps the background still while scrolling */
            background-color: #f4f7f6; /* Fallback color just in case image doesn't load */
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Velocity Valley</h2>
        <p>Please log in or create an account.</p>
        
        <!-- Standard HTML Input Boxes -->
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password" required>
        
        <!-- Our Two Specific Buttons -->
        <div>
            <button class="btn-login" onclick="loginUser()">Log In</button>
            <button class="btn-signup" onclick="signUpUser()">Sign Up</button>
        </div>

        <!-- This is where we will show error messages if they type the wrong password -->
        <p id="error-message" class="error-text"></p>
    </div>

    <script>
        // PASTE YOUR EXACT FIREBASE CONFIG HERE:
        const firebaseConfig = {
            apiKey: "AIzaSyA13Ven5xlpBW0ub_Wou92ZgQgiV2BzYzo",
            authDomain: "velocity-valley-edu.firebaseapp.com",
            projectId: "velocity-valley-edu",
            storageBucket: "velocity-valley-edu.firebasestorage.app",
            messagingSenderId: "340043533038",
            appId: "1:340043533038:web:0abf2444b8ac6da07f41ff"
        };
        
        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // Grab the text the user types into the boxes
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorText = document.getElementById('error-message');

        // FUNCTION 1: When they click "Log In"
        function loginUser() {
            errorText.innerText = ""; // Clear old errors
            firebase.auth().signInWithEmailAndPassword(emailInput.value, passwordInput.value)
                .then((userCredential) => {
                    // Success! Teleport to main menu
                    window.location.replace('/');
                })
                .catch((error) => {
                    // Fail! Show them the error message on screen
                    errorText.innerText = error.message;
                });
        }

        // FUNCTION 2: When they click "Sign Up"
        function signUpUser() {
            errorText.innerText = ""; // Clear old errors
            firebase.auth().createUserWithEmailAndPassword(emailInput.value, passwordInput.value)
                .then((userCredential) => {
                    // Success! Teleport to main menu
                    window.location.replace('/');
                })
                .catch((error) => {
                    // Fail! Show them the error message on screen
                    errorText.innerText = error.message;
                });
        }
    </script>
</body>
</html>
