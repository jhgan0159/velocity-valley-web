<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity Valley | My Dashboard</title>
    <style>
        /* Clean, modern dashboard styling */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .dashboard-container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        .header-section { text-align: center; border-bottom: 2px solid #ecf0f1; padding-bottom: 20px; margin-bottom: 20px; }
        h1 { color: #2c3e50; margin: 0 0 10px 0; }
        
        /* Grid for the statistics */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .stat-box { background: #f8f9fa; padding: 20px; border-radius: 8px; text-align: center; border-left: 5px solid #3498db; }
        .stat-box h3 { margin: 0; color: #7f8c8d; font-size: 1rem; font-weight: normal; }
        .stat-box .value { font-size: 2.5rem; color: #2c3e50; font-weight: bold; margin-top: 10px; }
        
        .info-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 1.1rem; border-bottom: 1px dashed #ccc; padding-bottom: 5px;}
        
        /* Buttons */
        .btn-group { display: flex; gap: 10px; margin-top: 30px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; color: white; text-align: center; text-decoration: none; font-weight: bold; transition: opacity 0.3s;}
        .btn:hover { opacity: 0.8; }
        .btn-home { background-color: #3498db; }
        .btn-logout { background-color: #e74c3c; }
    </style>

    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>

    <script>
      // PASTE YOUR EXACT FIREBASE CONFIG HERE:
      const firebaseConfig = {
        apiKey: "AIzaSyA13Ven5xlpBW0ub_Wou92ZgQgiV2BzYzo",
        authDomain: "velocity-valley-edu.firebaseapp.com",
        projectId: "velocity-valley-edu",
        storageBucket: "velocity-valley-edu.appspot.com",
        messagingSenderId: "645388489438",
        appId: "1:645388489438:web:1234567890abcdef"
      };
      
      if (!firebase.apps.length) { 
          firebase.initializeApp(firebaseConfig); 
      }
    </script>
</head>
<body>

    <div class="dashboard-container">
        <div class="header-section">
            <h1>Welcome back, <span id="display-name" style="color: #3498db;">Explorer</span>!</h1>
            <p style="color: #7f8c8d; margin: 0;">Here is your personal Velocity Valley profile.</p>
        </div>

        <div class="info-row">
            <strong>Email Address:</strong>
            <span id="display-email">Loading...</span>
        </div>
        <div class="info-row">
            <strong>Last Login:</strong>
            <span id="display-last-login">Loading...</span>
        </div>

        <div class="stat-grid">
            <div class="stat-box">
                <h3>Total Logins</h3>
                <div class="value" id="display-login-count">0</div>
            </div>
            <div class="stat-box" style="border-left-color: #2ecc71;">
                <h3>Simulations</h3>
                <div class="value" id="display-sims-explored">0</div>
            </div>
        </div>

        <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; border-left: 5px solid #f39c12; text-align: center; margin-top: 20px;">
            <h3 style="margin:0 0 5px 0; color:#7f8c8d; font-size: 1rem; font-weight: normal;">Physics Achievement Badges</h3>
            <p style="margin:0 0 15px 0; color:#2c3e50;">Current Streak: <span id="displayStreak" style="font-weight:bold; color:#e67e22; font-size:1.5rem;">0</span> Days</p>

            <div id="badgeContainer" style="display: flex; justify-content: center; gap: 15px; min-height: 80px; align-items: center;">
                <p style="color: #bdc3c7; font-size: 0.9rem; font-style: italic;">No badge yet. Answer daily questions to collect!</p>
            </div>
        </div>

        <div class="btn-group">
            <a href="/" class="btn btn-home">Back to Menu</a>
            <button class="btn btn-logout" onclick="logoutUser()">Sign Out</button>
        </div>
    </div>

    <script>
        // THE BOUNCER & DATA INJECTOR
// Initialize Firestore di dalam dashboard
        const db = firebase.firestore();

        // THE BOUNCER & DATA INJECTOR
        firebase.auth().onAuthStateChanged(function(user) {
            if (user) {
                // 1. Letak data Auth sedia ada
                document.getElementById('display-email').innerText = user.email;
                if (user.displayName) { document.getElementById('display-name').innerText = user.displayName; }
                const rawDate = new Date(user.metadata.lastSignInTime);
                document.getElementById('display-last-login').innerText = rawDate.toLocaleString(); 

                // 2. BACA DARI BUKU LOG (FIRESTORE) UNTUK DAPATKAN STATISTIK
// 2. BACA DARI BUKU LOG (FIRESTORE) UNTUK DAPATKAN STATISTIK & LENCANA
                db.collection("users").doc(user.uid).get().then((doc) => {
                    if (doc.exists) {
                        const userData = doc.data();
                        
                        // Kemas kini Statistik Asal
                        document.getElementById('display-login-count').innerText = userData.loginCount || 0;
                        document.getElementById('display-sims-explored').innerText = userData.simsExplored || 0;
                        
                        // ==========================================
                        // LOGIK LENCANA BARU BERMULA DI SINI
                        // ==========================================
                        const streak = userData.streakCount || 0;
                        document.getElementById("displayStreak").innerText = streak;
                        
                        let badgeHtml = "";
                        
                        // Semak jika layak dapat lencana 50 Hari
                        if (streak >= 50 && streak < 100) {
                            badgeHtml += `<img src="/static/images/badge50days.png" alt="50 Hari" style="width: 80px; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.2));">`;
                        } 
                        // Semak jika layak dapat kedua-dua lencana 50 & 100 Hari
                        if (streak >= 100) {
                            badgeHtml += `<img src="/static/images/badge50days.png" alt="50 Hari" style="width: 80px; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.2));">`;
                            badgeHtml += `<img src="/static/images/badge100days.png" alt="100 Hari" style="width: 80px; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.2));">`;
                        }

                        // Jika ada lencana, masukkan ke dalam HTML. Jika tiada, biarkan teks asal (Belum ada lencana).
                        if (badgeHtml !== "") {
                            document.getElementById("badgeContainer").innerHTML = badgeHtml;
                        }
                    }
                });

            } else {
                window.location.replace('/login');
            }
        });
        

        // The Sign Out Function for this specific page
        function logoutUser() {
            firebase.auth().signOut().then(() => {
                window.location.replace('/login');
            });
        }
    </script>
</body>
</html>
