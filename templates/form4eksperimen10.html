<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Eksperimen 6.2: Dalam Nyata & Dalam Ketara</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 450px;
            max-width: 650px;
        }
        canvas {
            border: 2px solid #bdc3c7;
            background-color: #ffffff;
            display: block;
            margin: 0 auto 15px auto;
            border-radius: 5px;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ecf0f1;
            padding: 15px;
            border-radius: 5px;
        }
        input[type="range"] {
            width: 50%;
            padding: 5px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .btn-excel {
            background-color: #27ae60;
            margin-top: 15px;
            width: 100%;
        }
        .btn-excel:hover {
            background-color: #2ecc71;
        }
        .reminder {
            font-weight: bold;
            text-align: center;
            margin-top: 5px;
            padding: 10px;
            border-radius: 5px;
        }
        .reminder.warning {
            background-color: #fdecea;
            color: #e74c3c;
            border: 1px solid #e74c3c;
        }
        .reminder.success {
            background-color: #eafaf1;
            color: #27ae60;
            border: 1px solid #27ae60;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        table, th, td {
            border: 1px solid #95a5a6;
        }
        th, td {
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #ecf0f1;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <h1>Simulasi Kaedah Tanpa Paralaks (Indeks Biasan Air)</h1>

    <div class="container">
        <div class="panel">
            <canvas id="simCanvas" width="600" height="400"></canvas>
            
            <div class="controls">
                <div class="control-group">
                    <label for="dalamNyata"><strong>Dalam Nyata, <i>H</i> : <span id="nilaiH">6.0</span> cm</strong></label>
                    <input type="range" id="dalamNyata" min="6.0" max="10.0" value="6.0" step="1.0">
                </div>
                <button id="btnRekod" onclick="rekodData()">Rekod Data ke Jadual</button>
                <div id="reminderText" class="reminder warning">⚠️ Sila rekodkan data untuk kedalaman air H = 6.0 cm!</div>
            </div>
        </div>

        <div class="panel">
            <h3>Jadual 6.3 Keputusan</h3>
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>Dalam nyata, <i>H</i> / cm</th>
                        <th>Jarak pin <i>P<sub>i</sub></i> dari dasar, <i>y</i> / cm</th>
                        <th>Dalam ketara, <i>h</i> / cm<br><small>(h = H - y)</small></th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
            
            <button class="btn-excel" onclick="muatTurunExcel()">Muat Turun Jadual (Excel / CSV)</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const sliderH = document.getElementById('dalamNyata');
        const labelH = document.getElementById('nilaiH');
        const reminderText = document.getElementById('reminderText');
        const jadualBody = document.querySelector('#dataTable tbody');

        // Pemalar Eksperimen
        const indeksBiasanAir = 1.33;
        const skalaGrapik = 25; // 1 cm = 25 pixel
        let H_semasa = 6.0;
        let h_semasa = 0;
        let y_semasa = 0;
        let dataSet = new Set();

        function kiraNilai() {
            // Formula: n = H / h  =>  h = H / n
            h_semasa = H_semasa / indeksBiasanAir;
            // Formula jarak dari dasar: y = H - h
            y_semasa = H_semasa - h_semasa;
        }

        function lukisSimulasi() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            kiraNilai();
            
            const dasarY = 350;
            const pusatBikarX = 150;
            const lebarBikar = 140;
            
            // 1. Lukis Kaki Retort & Pembaris
            ctx.fillStyle = "#7f8c8d"; 
            ctx.fillRect(350, dasarY, 150, 15); // Tapak
            ctx.fillStyle = "#bdc3c7"; 
            ctx.fillRect(420, 50, 10, dasarY - 50); // Tiang
            
            ctx.fillStyle = "#f39c12"; 
            ctx.fillRect(320, 50, 25, 300); // Pembaris Kayu
            ctx.fillStyle = "black";
            ctx.font = "12px Arial";
            for(let i=0; i<=11; i++) {
                let yPos = dasarY - (i * skalaGrapik);
                ctx.beginPath();
                ctx.moveTo(320, yPos);
                ctx.lineTo(330, yPos);
                ctx.stroke();
                if(i % 2 === 0 && i !== 0) ctx.fillText(i, 332, yPos + 4);
            }

            // 2. Lukis Bikar dan Air
            let tinggiAirPx = H_semasa * skalaGrapik;
            let parasAirY = dasarY - tinggiAirPx;
            
            ctx.fillStyle = "rgba(52, 152, 219, 0.4)"; // Air
            ctx.fillRect(pusatBikarX - lebarBikar/2, parasAirY, lebarBikar, tinggiAirPx);
            
            ctx.strokeStyle = "#2c3e50"; // Bikar Kaca
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(pusatBikarX - lebarBikar/2, 60); // Bikar mula dari ketinggian 60px
            ctx.lineTo(pusatBikarX - lebarBikar/2, dasarY);
            ctx.lineTo(pusatBikarX + lebarBikar/2, dasarY);
            ctx.lineTo(pusatBikarX + lebarBikar/2, 60);
            ctx.stroke();

            // 3. Lukis Pin Po (Di dasar bikar)
            ctx.fillStyle = "#c0392b"; 
            ctx.beginPath();
            ctx.arc(pusatBikarX, dasarY - 5, 5, 0, Math.PI*2);
            ctx.fill();
            ctx.fillRect(pusatBikarX - 2, dasarY - 20, 4, 15);
            ctx.fillStyle = "black";
            ctx.fillText("Pin Po", pusatBikarX - 15, dasarY + 15);

            // 4. Lukis Imej Pin Po (Dalam ketara)
            let parasImejY = parasAirY + (h_semasa * skalaGrapik);
            ctx.fillStyle = "rgba(192, 57, 43, 0.4)"; // Merah pudar (Maya)
            ctx.beginPath();
            ctx.arc(pusatBikarX, parasImejY - 5, 5, 0, Math.PI*2);
            ctx.fill();
            ctx.fillRect(pusatBikarX - 2, parasImejY - 20, 4, 15);
            ctx.fillStyle = "#555";
            ctx.fillText("Imej Po", pusatBikarX - 20, parasImejY - 25);

            // 5. Lukis Pin Pi (Pencari / Gabus luar bikar)
            let ySemasaPx = y_semasa * skalaGrapik;
            let pinPiY = dasarY - ySemasaPx;
            
            ctx.fillStyle = "#8e44ad"; 
            ctx.beginPath();
            ctx.moveTo(pusatBikarX + lebarBikar/2 + 10, pinPiY);
            ctx.lineTo(310, pinPiY - 5);
            ctx.lineTo(310, pinPiY + 5);
            ctx.fill();
            ctx.fillStyle = "#d35400"; // Pemegang Gabus
            ctx.fillRect(310, pinPiY - 8, 30, 16);
            ctx.fillStyle = "black";
            ctx.fillText("Pin Pi (y = " + y_semasa.toFixed(1) + " cm)", 190, pinPiY + 20);

            // 6. Label H dan h
            ctx.beginPath();
            ctx.setLineDash([5, 5]);
            ctx.moveTo(80, parasAirY); ctx.lineTo(150, parasAirY);
            ctx.moveTo(80, dasarY); ctx.lineTo(150, dasarY);
            ctx.moveTo(110, parasImejY); ctx.lineTo(150, parasImejY);
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.strokeStyle = "blue";
            ctx.beginPath(); 
            ctx.moveTo(60, parasAirY); ctx.lineTo(60, dasarY);
            ctx.stroke();
            ctx.fillStyle = "blue";
            ctx.fillText("H = " + H_semasa.toFixed(1) + " cm", 10, (parasAirY + dasarY)/2);
            
            ctx.strokeStyle = "green";
            ctx.beginPath(); 
            ctx.moveTo(90, parasAirY); ctx.lineTo(90, parasImejY);
            ctx.stroke();
            ctx.fillStyle = "green";
            ctx.fillText("h", 95, (parasAirY + parasImejY)/2 + 5);
            
            ctx.font = "30px Arial";
            ctx.fillText("👁️", pusatBikarX - 15, 45); // Mata pemerhati
        }

        function kemaskiniPeringatan() {
            if(dataSet.has(H_semasa)) {
                reminderText.className = "reminder success";
                reminderText.innerText = "✓ Data untuk H = " + H_semasa.toFixed(1) + " cm telah direkodkan.";
            } else {
                reminderText.className = "reminder warning";
                reminderText.innerText = "⚠️ Sila rekodkan data untuk kedalaman air H = " + H_semasa.toFixed(1) + " cm!";
            }
        }

        // Event Listeners
        sliderH.addEventListener('input', function() {
            H_semasa = parseFloat(this.value);
            labelH.innerText = H_semasa.toFixed(1);
            kemaskiniPeringatan();
            lukisSimulasi();
        });

        // Fungsi Merekod Data
        function rekodData() {
            if (dataSet.has(H_semasa)) {
                alert("Data untuk H = " + H_semasa.toFixed(1) + " cm telah pun direkodkan.");
                return;
            }

            let H_str = H_semasa.toFixed(1);
            let y_str = y_semasa.toFixed(1);
            let h_str = (H_semasa - y_semasa).toFixed(1);

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${H_str}</td>
                <td>${y_str}</td>
                <td>${h_str}</td>
            `;
            jadualBody.appendChild(row);

            dataSet.add(H_semasa);
            kemaskiniPeringatan();
        }

        // Fungsi Muat Turun Data ke Excel (CSV)
        function muatTurunExcel() {
            if(dataSet.size === 0) {
                alert("Jadual masih kosong. Sila rekodkan sekurang-kurangnya satu data.");
                return;
            }

            let csvContent = "Dalam nyata H (cm),Jarak pin Pi dari dasar y (cm),Dalam ketara h (cm)\n";
            let rows = jadualBody.querySelectorAll("tr");
            
            rows.forEach(function(row) {
                let cols = row.querySelectorAll("td");
                let rowData = [];
                cols.forEach(function(col) {
                    rowData.push(col.innerText);
                });
                csvContent += rowData.join(",") + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            
            link.setAttribute("href", url);
            link.setAttribute("download", "Data_Eksperimen_Tanpa_Paralaks.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Mula simulasi
        lukisSimulasi();
    </script>
