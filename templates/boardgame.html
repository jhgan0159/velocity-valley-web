<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Physics Monopoly: Ultimate Edition</title>
    <link rel="stylesheet" href="/static/style.css">

    <!-- 手机端适配专属 CSS -->
    <style>
        /* =========================================
           BOARDGAME - 手机竖屏 (Portrait) & 通用优化
           ========================================= */
        @media (max-width: 950px) {
            /* 1. 弹窗 (Modal) 安全调整 */
            .modal-content {
                width: 95% !important;
                max-width: 400px !important;
                padding: 20px !important;
                max-height: 85vh !important;
                overflow-y: auto !important;
            }
            #game-setup-modal h2 { font-size: 1.5rem !important; margin-top: 0 !important; }
            #question-level { font-size: 1.2rem !important; margin-top: 0 !important; }
            #question-image { max-height: 120px !important; }
            
            /* 2. 排行榜 (Leaderboard) 变成弹窗模式 */
            #leaderboard-container {
                display: none !important; /* 手机端默认隐藏，靠 JS 控制显示 */
                position: fixed !important;
                top: 50% !important;
                left: 50% !important;
                transform: translate(-50%, -50%) !important;
                background: white !important;
                z-index: 10000 !important;
                width: 90% !important;
                max-width: 350px !important;
                padding: 20px !important;
                border-radius: 15px !important;
                box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important;
            }
            /* 配合 JS 添加的类名来显示排行榜 */
            #leaderboard-container.mobile-show {
                display: block !important;
                animation: popUp 0.3s ease-out forwards;
            }

            /* 3. 手机端专属按钮的样式 */
            #mobile-leaderboard-btn {
                display: block !important;
                background-color: #f1c40f;
                color: #333;
                border: 2px solid #f39c12;
                padding: 12px !important;
                border-radius: 8px;
                font-weight: bold;
                font-size: 1.1rem;
                margin-bottom: 15px;
                width: 100%;
                cursor: pointer;
            }
            #close-leaderboard-btn {
                display: block !important;
                background-color: #e74c3c;
                color: white;
                border: none;
                padding: 8px 15px;
                border-radius: 8px;
                margin-bottom: 15px;
                cursor: pointer;
                width: 100%;
                font-weight: bold;
            }

            /* 4. 棋盘布局调整 (防切断) */
            body { align-items: center !important; justify-content: flex-start !important; overflow-x: hidden; }
            #app-wrapper { width: 100vw !important; display: flex !important; flex-direction: column !important; align-items: center !important; padding: 0 !important; }
            .game-container { width: 100vw !important; display: flex !important; flex-direction: column !important; align-items: center !important; overflow: hidden !important; }
            
            /* 控制台居中 */
            .controls {
                width: 95% !important;
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                z-index: 10 !important;
                padding-bottom: 30px !important;
            }

            /* 视频跳过按钮调整 */
            #skip-intro-btn {
                padding: 8px 15px !important;
                font-size: 1rem !important;
                bottom: 15px !important;
                right: 15px !important;
            }
        }

        /* =========================================
           BOARDGAME - 手机横屏 (Landscape) 专属优化
           ========================================= */
        @media (max-width: 950px) and (orientation: landscape) {
            #app-wrapper {
                flex-direction: row !important; /* 横屏时强制主容器左右排版 */
                height: 100vh !important;
                overflow: hidden !important;
            }

            .game-container {
                flex-direction: row !important; /* 强制左右排版 */
                align-items: center !important;
                justify-content: flex-start !important;
                height: 100vh !important;
                padding: 0 !important;
            }

            .controls {
                order: -1 !important; /* 强制把控制台排在棋盘的左边 */
                width: 25% !important; /* 占据左边空间 */
                min-width: 170px !important;
                max-width: 200px !important;
                height: 100vh !important;
                justify-content: center !important; /* 垂直居中按钮和骰子 */
                padding: 10px !important;
                background: rgba(255, 255, 255, 0.9) !important; /* 半透明背景防遮挡 */
                border-right: 3px solid #3498db;
                margin-bottom: 0 !important;
                box-sizing: border-box !important;
                overflow-y: auto !important; /* 内容过多可滑动 */
            }

            #game-board {
                margin-bottom: 0 !important; /* 横屏不需要底部留白补偿 */
                margin-left: 10px !important; /* 和左边的控制台拉开一点距离 */
            }
            
            #mobile-leaderboard-btn {
                font-size: 0.85rem !important; /* 横屏时按钮稍微缩细一点 */
                padding: 8px !important;
            }
        }

        /* 在电脑端隐藏手机专属按钮 */
        @media (min-width: 951px) {
            #mobile-leaderboard-btn, #close-leaderboard-btn { display: none !important; }
        }

        @keyframes popUp { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div id="intro-overlay" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:black; z-index:9999; display:flex; justify-content:center; align-items:center;">
        <video id="intro-video" width="100%" height="100%" style="object-fit:contain; position:absolute; top:0; left:0;" playsinline>
            <source src="/static/images/montage.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <button id="start-intro-btn" style="z-index:10001; padding:20px 40px; font-size:2em; background:#2196F3; color:white; border:none; border-radius:10px; cursor:pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
            Starts The Game
        </button>
        <button id="skip-intro-btn" style="position:absolute; bottom:30px; right:30px; padding:10px 20px; font-size:1.2em; background:rgba(255,255,255,0.8); border:none; cursor:pointer; border-radius:5px; z-index:10001; display:none;">Skip Intro</button>
    </div>

    <video autoplay muted loop id="video-background" style="position:fixed; top:0; left:0; width:100vw; height:100vh; object-fit:cover; z-index:-1000;">
        <source src="/static/images/background.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div id="game-setup-modal">
        <div class="modal-content">
            <h2>Game Setup</h2>
            <label for="player-count-select">Select Number of Players:</label>
            <select id="player-count-select">
                <option value="1">1 Player</option>
                <option value="2">2 Players</option>
                <option value="3">3 Players</option>
                <option value="4" selected>4 Players</option>
            </select>
            <label for="round-count-input" style="display:block; margin-top:15px;">Number of Rounds:</label>
            <input type="number" id="round-count-input" value="10" min="1" max="50" style="width: 100%; padding: 10px; font-size: 1.1em; margin-top: 5px; box-sizing: border-box;">
            <div id="player-inputs-container"></div>
            <button id="start-game-btn">Start Game</button>
        </div>
    </div>

    <div id="app-wrapper">
        <div id="leaderboard-container" class="hidden">
            <!-- 手机端关闭排行榜的按钮 -->
            <button id="close-leaderboard-btn" onclick="toggleMobileLeaderboard()">❌ Close Leaderboard</button>
            
            <h2>Leaderboard</h2>
            <ol id="score-list"></ol>
            <div id="round-counter">Round: 1 / 20</div>
            <div id="game-timer">Time: 00:00</div>
        </div>

        <div class="game-container hidden">
            <!-- 新增：手机端显示排行榜的按钮 (移到控制台上方，方便点击) -->
            <div class="controls">
                <button id="mobile-leaderboard-btn" onclick="toggleMobileLeaderboard()">🏆 Show Leaderboard</button>
                
                <div class="current-player-info">
                    Current Player: <span id="current-player-color"></span> <span id="current-player-name"></span>
                </div>
                <div class="dice-area">
                    <img id="dice-image" src="/static/images/dice-1.png" alt="Dice">
                </div>
                <button id="roll-dice-btn">Roll Dice</button>
                <div id="game-log">Select players to start.</div>
            </div>

            <div id="game-board">
                <!-- 棋盘内容由 script.js 生成 -->
            </div>
        </div>
    </div>

    <!-- 各种问答/特效模态框保持原样 -->
    <div id="question-modal" class="hidden">
        <div class="modal-content">
            <h3 id="question-level"></h3>
            <img id="question-image" src="" alt="Question Image" class="hidden">
            <p id="question-text"></p>
            <input type="text" id="answer-box" placeholder="Type your answer here (A, B, C)...">
            <button id="submit-answer-btn">Submit Answer</button>
        </div>
    </div>

    <div id="explanation-modal" class="hidden">
        <div class="modal-content">
            <h3 id="explanation-title"></h3>
            <p id="explanation-correct-answer"></p>
            <p id="explanation-text"></p>
            <button id="continue-game-btn">Continue Game</button>
        </div>
    </div>

    <div id="powerup-modal" class="hidden">
        <div class="modal-content" style="text-align: center;">
            <h2 style="color: #FF9800;">3-STREAK! POWER UP!</h2>
            <p>You answered 3 in a row! Spin for a reward!</p>
            <div id="wheel-display" style="font-size: 2em; font-weight: bold; margin: 20px 0; padding: 20px; border: 3px dashed #333; border-radius: 10px; background: #fff3e0;">???</div>
            <button id="spin-btn" style="background-color: #FF9800;">SPIN THE WHEEL</button>
            <button id="close-powerup-btn" class="hidden">Continue</button>
        </div>
    </div>

    <div id="game-over-modal" class="hidden">
        <div class="modal-content">
            <h2>Game Over!</h2>
            <h3 id="final-winner"></h3>
            <p id="final-average"></p>
            <p>Thanks for playing!</p>
            <button id="export-btn" style="background-color: #2196F3; margin-top: 20px;">Export Results to Excel (.xls)</button>
            <button onclick="location.reload()" style="background-color: #666; margin-top: 10px;">Play Again</button>
        </div>
    </div>

    <script src="/static/script.js"></script>

    <!-- 手机端交互与智能缩放逻辑 -->
    <script>
        // 1. 切换排行榜显示的函数
        function toggleMobileLeaderboard() {
            const lb = document.getElementById('leaderboard-container');
            if (lb) {
                lb.classList.toggle('mobile-show');
            }
        }

        // 2. 动态检测手机屏幕宽度与方向，强制完美缩放棋盘
        function resizeBoardForMobile() {
            if (window.innerWidth <= 950) {
                const board = document.getElementById('game-board');
                if (board) {
                    const screenWidth = window.innerWidth;
                    const screenHeight = window.innerHeight;
                    const boardOriginalWidth = 700; // 假设原版棋盘是 700px 宽

                    let scaleFactor = 1;

                    // 判断手机现在是横屏还是直屏
                    if (screenWidth > screenHeight) {
                        // 【横屏模式 (Landscape)】
                        // 左边留出给骰子和按钮的空间，剩下的宽度给棋盘
                        const leftControlsWidth = Math.max(screenWidth * 0.25, 170); 
                        const availableWidth = screenWidth - leftControlsWidth - 20; // 减去间距
                        scaleFactor = availableWidth / boardOriginalWidth;
                        
                        if (scaleFactor < 1) {
                            board.style.transform = `scale(${scaleFactor})`;
                            board.style.transformOrigin = 'center left'; // 横屏时靠左缩放
                            board.style.marginBottom = '0px'; // 横屏不需要拉伸底部
                        } else {
                            board.style.transform = 'none';
                        }
                    } else {
                        // 【竖屏模式 (Portrait)】
                        // 上下排版
                        scaleFactor = (screenWidth * 0.95) / boardOriginalWidth;
                        
                        if (scaleFactor < 1) {
                            board.style.transform = `scale(${scaleFactor})`;
                            board.style.transformOrigin = 'top center'; // 直屏时靠上居中缩放
                            
                            // 抵消缩放后留下的空白，把下方的按钮拉上来
                            const originalHeight = board.offsetHeight || 700;
                            const blankSpace = originalHeight * (1 - scaleFactor);
                            board.style.marginBottom = `-${blankSpace}px`;
                        } else {
                            board.style.transform = 'none';
                            board.style.marginBottom = '0px';
                        }
                    }
                }
            } else {
                // 电脑端重置样式
                const board = document.getElementById('game-board');
                if(board) {
                    board.style.transform = 'none';
                    board.style.marginBottom = '0px';
                }
            }
        }

        // 当页面加载完成，或者学生旋转手机屏幕时，自动计算缩放比例
        window.addEventListener('load', resizeBoardForMobile);
        window.addEventListener('resize', resizeBoardForMobile);
        
        // 由于棋盘是被 script.js 延迟生成的，延时计算确保生效
        setTimeout(resizeBoardForMobile, 1000);
        setTimeout(resizeBoardForMobile, 3000);
    </script>

    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>

        const firebaseConfig = {
            apiKey: "AIzaSyA13Ven5xlpBW0ub_Wou92ZgQgiV2BzYzo",
            authDomain: "velocity-valley-edu.firebaseapp.com",
            projectId: "velocity-valley-edu",
            storageBucket: "velocity-valley-edu.firebasestorage.app",
            messagingSenderId: "340043533038",
            appId: "1:340043533038:web:0abf2444b8ac6da07f41ff"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        firebase.auth().onAuthStateChanged(function(user) {
            if (user) {
                console.log("Student/Teacher logged in: " + user.email);
                const pageID = "visited_boardgame";
                if (!sessionStorage.getItem(pageID)) {
                    db.collection("users").doc(user.uid).set({
                        simsExplored: firebase.firestore.FieldValue.increment(1)
                    }, { merge: true })
                    .then(() => {
                        sessionStorage.setItem(pageID, "true");
                    });
                }
            } else {
                window.location.replace('/login');
            }
        });
    </script>
</body>
</html>
